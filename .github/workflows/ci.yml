name: Packer Validate

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Packer
        uses: hashicorp/setup-packer@v2

      - name: Validate Template
        run: packer validate packer/ubuntu.pkr.hcl
